<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pugodOS v2.0 — Шляпная Перезагрузка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a0933; }
        
        /* Темы */
        .theme-pugod { background: linear-gradient(135deg, #251145, #0d041a); }
        .theme-shlyapa { background: radial-gradient(circle, #3d0c40, #140217); }
        .theme-zakviel { background: linear-gradient(45deg, #0f1b29, #04080f); }

        /* Рабочий стол */
        #desktop { width: 100%; height: calc(100% - 50px); position: relative; padding: 15px; display: flex; flex-direction: column; gap: 15px; align-content: flex-start; flex-wrap: wrap; }
        
        /* Ярлыки */
        .shortcut { width: 85px; height: 95px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; border-radius: 6px; }
        .shortcut:hover { background: rgba(255, 255, 255, 0.1); }
        .shortcut-icon { font-size: 36px; margin-bottom: 5px; }
        .shortcut-label { color: #fff; font-size: 12px; text-shadow: 1px 1px 2px #000; word-break: break-all; }

        /* Окна */
        .window { position: absolute; width: 360px; height: 300px; background: rgba(20, 10, 30, 0.9); backdrop-filter: blur(8px); border: 2px solid #8a2be2; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; flex-direction: column; overflow: hidden; z-index: 10; touch-action: none; }
        .window-header { background: #8a2be2; color: white; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: move; font-weight: bold; font-size: 14px; }
        .window-close { background: #ff4d4d; border: none; width: 20px; height: 20px; border-radius: 50%; color: white; cursor: pointer; font-weight: bold; font-size: 11px; }
        .window-content { flex: 1; padding: 12px; color: white; overflow-y: auto; }

        /* Приложения */
        .notepad-textarea { width: 100%; height: 100%; background: transparent; border: none; color: #fff; font-size: 14px; resize: none; outline: none; }
        .terminal-body { background: #000; font-family: monospace; color: #00ff00; height: 100%; display: flex; flex-direction: column; padding: 8px; font-size: 13px; }
        .terminal-output { flex: 1; overflow-y: auto; margin-bottom: 5px; white-space: pre-wrap; }
        .terminal-input-row { display: flex; align-items: center; }
        .terminal-input { background: transparent; border: none; color: #00ff00; font-family: monospace; font-size: 13px; flex: 1; outline: none; margin-left: 5px; }
        .settings-btn { background: #8a2be2; color: white; border: none; padding: 8px; margin: 4px 0; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }

        /* Панель задач и Меню */
        #taskbar { width: 100%; height: 50px; background: rgba(10, 3, 20, 0.95); border-top: 1px solid #8a2be2; display: flex; align-items: center; padding: 0 15px; position: absolute; bottom: 0; z-index: 9999; }
        .start-button { background: linear-gradient(45deg, #8a2be2, #4a154b); color: white; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        #start-menu { position: absolute; bottom: 55px; left: 15px; width: 200px; background: #12071f; border: 2px solid #8a2be2; border-radius: 6px; display: none; flex-direction: column; padding: 4px; z-index: 10000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .start-menu-item { padding: 8px; color: white; cursor: pointer; border-radius: 4px; font-size: 13px; }
        .start-menu-item:hover { background: #8a2be2; }

        /* Мобильная адаптация */
        @media (max-width: 600px) { .window { width: 88% !important; left: 6% !important; top: 40px !important; height: 280px !important; } }
    </style>
</head>
<body class="theme-pugod">

    <div id="desktop">
        <div class="shortcut" onclick="openWindow('notepad')">
            <div class="shortcut-icon">📝</div>
            <div class="shortcut-label">Заметки.txt</div>
        </div>
        <div class="shortcut" onclick="openWindow('terminal')">
            <div class="shortcut-icon">💻</div>
            <div class="shortcut-label">Консоль.exe</div>
        </div>
        <div class="shortcut" onclick="openWindow('settings')">
            <div class="shortcut-icon">⚙️</div>
            <div class="shortcut-label">Настройки</div>
        </div>

        <!-- Окно Блокнота -->
        <div id="win-notepad" class="window" style="top:60px; left:20px;">
            <div class="window-header"><span>📝 Блокнот</span><button class="window-close" onclick="closeWindow('notepad')">×</button></div>
            <div class="window-content"><textarea class="notepad-textarea" id="notepad-text" placeholder="Шляпные мысли..." oninput="saveNotes()"></textarea></div>
        </div>

        <!-- Окно Терминала -->
        <div id="win-terminal" class="window" style="top:100px; left:40px;">
            <div class="window-header"><span>💻 Терминал</span><button class="window-close" onclick="closeWindow('terminal')">×</button></div>
            <div class="window-content" style="padding:0;">
                <div class="terminal-body">
                    <div class="terminal-output" id="term-out">[пугодОС v2.0]: Введи help для команд.</div>
                    <div class="terminal-input-row"><span style="color:#8a2be2">></span><input type="text" class="terminal-input" id="term-in" onkeydown="handleTerminal(event)"></div>
                </div>
            </div>
        </div>

        <!-- Окно Настроек -->
        <div id="win-settings" class="window" style="top:40px; left:10px;">
            <div class="window-header"><span>⚙️ Настройки</span><button class="window-close" onclick="closeWindow('settings')">×</button></div>
            <div class="window-content">
                <button class="settings-btn" onclick="changeTheme('theme-pugod')">База Пугода</button>
                <button class="settings-btn" onclick="changeTheme('theme-shlyapa')">Шляпный неон</button>
                <button class="settings-btn" onclick="changeTheme('theme-zakviel')">Скрытный Заквиель</button>
            </div>
        </div>
    </div>

    <!-- Меню Пуск -->
    <div id="start-menu">
        <div class="start-menu-item" onclick="openWindow('notepad'); toggleStartMenu();">📝 Блокнот</div>
        <div class="start-menu-item" onclick="openWindow('terminal'); toggleStartMenu();">💻 Терминал</div>
        <div class="start-menu-item" onclick="openWindow('settings'); toggleStartMenu();">⚙️ Настройки</div>
    </div>

    <!-- Панель задач -->
    <div id="taskbar">
        <div class="start-button" onclick="toggleStartMenu(event)">🎩 ПУГОД</div>
    </div>
        <script>
        function toggleStartMenu(e) {
            if (e) e.stopPropagation();
            const m = document.getElementById('start-menu');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }
        document.getElementById('desktop').addEventListener('click', () => {
            document.getElementById('start-menu').style.display = 'none';
        });
        function openWindow(id) {
            const w = document.getElementById('win-' + id);
            if (w) {
                w.style.display = 'flex';
                document.querySelectorAll('.window').forEach(win => win.style.zIndex = 10);
                w.style.zIndex = 100;
            }
        }
        function closeWindow(id) {
            const w = document.getElementById('win-' + id);
            if (w) w.style.display = 'none';
        }
        function saveNotes() {
            localStorage.setItem('p2_notes', document.getElementById('notepad-text').value);
        }
        window.onload = function() {
            document.getElementById('notepad-text').value = localStorage.getItem('p2_notes') || '';
        }
        function changeTheme(n) { document.body.className = n; }
        function handleTerminal(e) {
            if (e.key === 'Enter') {
                const i = document.getElementById('term-in');
                const o = document.getElementById('term-out');
                const cmd = i.value.trim().toLowerCase();
                o.innerHTML += `\n> ${i.value}`;
                if (cmd === 'help') o.innerHTML += `\nКоманды: shlyapa, bag, clear`;
                else if (cmd === 'shlyapa') o.innerHTML += `\nЦилиндр на месте!`;
                else if (cmd === 'bag') o.innerHTML += `\nПакеты украдены Заквиелем.`;
                else if (cmd === 'clear') o.innerHTML = `[пугодОС]: Очищено.`;
                else if (cmd !== '') o.innerHTML += `\nОшибка.`;
                i.value = ''; o.scrollTop = o.scrollHeight;
            }
        }
        document.querySelectorAll('.window-header').forEach(header => {
            header.addEventListener('mousedown', drag);
            header.addEventListener('touchstart', drag, { passive: false });
            function drag(e) {
                const win = header.parentElement;
                document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
                win.style.zIndex = 100;
                const isT = e.type === 'touchstart';
                const p = isT ? e.touches[0] : e;
                const sX = p.clientX - win.getBoundingClientRect().left;
                const sY = p.clientY - win.getBoundingClientRect().top;
                if (isT) e.preventDefault();
                function move(me) {
                    const mp = isT ? me.touches[0] : me;
                    let top = mp.clientY - sY; if (top < 0) top = 0;
                    win.style.left = (mp.clientX - sX) + 'px';
                    win.style.top = top + 'px';
                }
                if (isT) {
                    document.addEventListener('touchmove', move, { passive: false });
                    document.addEventListener('touchend', () => document.removeEventListener('touchmove', move), { once: true });
                } else {
                    document.addEventListener('mousemove', move);
                    document.addEventListener('mouseup', () => document.removeEventListener('mousemove', move), { once: true });
                }
            }
        });
    </script>
